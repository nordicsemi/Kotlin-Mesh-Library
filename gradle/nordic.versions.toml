[versions]
common = "2.11.2"     # https://github.com/NordicSemiconductor/Android-Common-Libraries
ble = "2.11.0"
blek = "2.0.0-beta07"
log = "2.6.0"
scanner = "1.6.0"
util = "1.2.0"
mcumgr = "3.5.0"       # https://github.com/nordicsemi/Android-nRF-Connect-Device-Manager

[libraries]
ble = { group = "no.nordicsemi.android", name = "ble", version.ref = "ble" }
blek-client-core = { group = "no.nordicsemi.kotlin.ble", name = "client-core", version.ref = "blek" }
blek-client-core-android = { group = "no.nordicsemi.kotlin.ble", name = "client-core-android", version.ref = "blek" }
blek-client-android = { group = "no.nordicsemi.kotlin.ble", name = "client-android", version.ref = "blek" }
compat-scanner = { group = "no.nordicsemi.android.support.v18", name = "scanner", version.ref = "scanner" }

# Kotlin logging facade
kotlin-log = { group = "no.nordicsemi.kotlin", name = "log", version.ref = "util" }
kotlin-log-timber = { group = "no.nordicsemi.kotlin", name = "log-timber", version.ref = "util" }

# Timber -> nRF Logger integration
log-timber = { group = "no.nordicsemi.android", name = "log-timber", version.ref = "log" }

# MCUmgr and DFU for nRF Connect SDK
mcumgr-core = { group = "no.nordicsemi.android", name = "mcumgr-core", version.ref = "mcumgr" }
mcumgr-core-ktx = { group = "no.nordicsemi.android", name = "mcumgr-core-ktx", version.ref = "mcumgr" }
mcumgr-ble = { group = "no.nordicsemi.android", name = "mcumgr-ble", version.ref = "mcumgr" }
mcumgr-ble2 = { group = "no.nordicsemi.android", name = "mcumgr-ble2", version.ref = "mcumgr" }
mcumgr-ota = { group = "no.nordicsemi.android", name = "ota", version.ref = "mcumgr" }
mcumgr-observability = { group = "no.nordicsemi.android", name = "observability", version.ref = "mcumgr" }

# Nordic Common Libraries
logger = { group = "no.nordicsemi.android.common", name = "logger", version.ref = "common" }
permissions-ble = { group = "no.nordicsemi.android.common", name = "permissions-ble", version.ref = "common" }
scanner-ble = { group = "no.nordicsemi.android.common", name = "scanner-ble", version.ref = "common" }
theme = { group = "no.nordicsemi.android.common", name = "theme", version.ref = "common" }
ui = { group = "no.nordicsemi.android.common", name = "ui", version.ref = "common" }

# Nordic Kotlin data library, released together with the logging facade
kotlin-data = { group = "no.nordicsemi.kotlin", name = "data", version.ref = "util" }
